:root{--sapin:#07360F;--dore:#AA8500;--creme:#F1EFE9;--orange:#FF4E02;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sapin);color:var(--creme);font-family:Roboto,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-family:Kufam,sans-serif;font-weight:400;font-size:clamp(34px,8vw,48px);line-height:1}
h1 b{font-weight:700;color:var(--dore)}
p{margin:0;font-size:15px;opacity:.8;line-height:1.5}
label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
input{width:100%;margin-top:8px;padding:14px 16px;font:inherit;font-size:17px;color:var(--creme);background:transparent;border:1px solid rgba(241,239,233,.6);border-radius:999px;outline:none}
input:focus{border-color:var(--dore)}
button{padding:14px 16px;font-family:Kufam,sans-serif;font-weight:700;font-size:17px;color:var(--sapin);background:var(--dore);border:0;border-radius:999px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.err{min-height:20px;font-size:14px;color:#FFB08A}
</style>

async function open_(code) {

async function tryCode(code, silent) {
